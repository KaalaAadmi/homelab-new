# AdGuard Home: DNS for the home and the tailnet (ad blocking + *.home.<domain> names for Caddy).
# Port 53 clashes with systemd-resolved's stub on Fedora/Ubuntu: see the README before starting.
# In the first-run wizard, set the admin web interface to port 3000 (80 belongs to Caddy).

name: adguard

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    volumes:
      - ${APPDATA:-${HOME}/volumes}/adguard/work:/opt/adguardhome/work:Z
      - ${APPDATA:-${HOME}/volumes}/adguard/conf:/opt/adguardhome/conf:Z
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 3000:3000/tcp                  # setup wizard, then the admin UI
    networks:
      - homelab                        # so Glance's DNS widget can reach it
    restart: unless-stopped

networks:
  homelab:
    external: true
