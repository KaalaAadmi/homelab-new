global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']   # container name on the homelab network

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']        # internal port, not the 8282 published one
