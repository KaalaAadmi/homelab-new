# Prometheus + Grafana + node-exporter (host metrics) + cAdvisor (container metrics)

name: monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus     # named volume: avoids permission errors (runs as nobody)
    ports:
      - 9898:9090
    networks:
      - homelab
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_LOG_LEVEL: info
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://k8plus:1234}
      # Log in with Authentik (optional: leave GRAFANA_OAUTH_CLIENT_ID empty to use local login)
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${AUTHENTIK_URL:-https://authentik.example.com}/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${AUTHENTIK_URL:-https://authentik.example.com}/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: ${AUTHENTIK_URL:-https://authentik.example.com}/application/o/userinfo/
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${AUTHENTIK_URL:-https://authentik.example.com}/application/o/grafana/end-session/
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'Grafana Admins') && 'Admin' || 'Viewer'"
    volumes:
      - grafana-data:/var/lib/grafana   # named volume: avoids permission errors (runs as UID 472)
    ports:
      - 1234:3000
    networks:
      - homelab
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    security_opt:
      - label=disable            # SELinux on Fedora blocks reading host paths otherwise
    networks:
      - homelab
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - 8282:8080
    networks:
      - homelab
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  homelab:
    external: true
