# Firefly III + data importer + nightly cron. Database: "firefly" on the shared Postgres.
# Copy .env.example -> .env and .importer.env.example -> .importer.env
# STATIC_CRON_TOKEN in .env is also used below (Compose reads .env for ${...}).

name: firefly

services:
  app:
    image: fireflyiii/core:latest
    container_name: firefly_iii_core
    hostname: app
    env_file: .env
    volumes:
      - ${APPDATA:-${HOME}/volumes}/firefly/upload:/var/www/html/storage/upload:Z
    ports:
      - 1212:8080
    networks:
      - firefly
      - db
    restart: unless-stopped

  importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly_iii_importer
    hostname: importer
    env_file: .importer.env
    ports:
      - 1313:8080
    depends_on:
      - app
    networks:
      - firefly
    restart: unless-stopped

  cron:
    image: alpine:3
    container_name: firefly_iii_cron
    command: >-
      sh -c "echo '0 3 * * * wget -qO- http://app:8080/api/v1/cron/${STATIC_CRON_TOKEN:?set STATIC_CRON_TOKEN in .env}'
      | crontab - && crond -f -L /dev/stdout"
    networks:
      - firefly
    restart: unless-stopped

networks:
  firefly: {}
  db:
    external: true
