# CouchDB for the Obsidian "Self-hosted LiveSync" plugin. Reach it over Tailscale only.
# livesync.ini holds the settings LiveSync needs (CORS, single node, request sizes).
#
# livesync-bridge keeps a plain Markdown copy of the vault in ~/vault, in both directions:
# edits in Obsidian appear there, and files YETI writes there appear in Obsidian.
# It has no published image, so Compose builds it from the project's GitHub repo.

name: obsidian-livesync

services:
  couchdb:
    image: couchdb:3
    container_name: obsidian-livesync
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-obsidian}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}
    volumes:
      - ${APPDATA:-${HOME}/volumes}/couchdb/data:/opt/couchdb/data:Z
      - ./livesync.ini:/opt/couchdb/etc/local.d/livesync.ini:ro,z
    ports:
      - 5984:5984
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5984/_up | grep -q '\"status\":\"ok\"'"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  livesync-bridge:
    build:
      context: https://github.com/vrtmrz/livesync-bridge.git#main
    image: localhost/livesync-bridge:latest
    container_name: livesync-bridge
    volumes:
      - ${APPDATA:-${HOME}/volumes}/livesync-bridge/dat:/app/dat:Z     # config.json lives here
      - ${VAULT_DIR:-${HOME}/vault}:/app/data/vault:z                   # the Markdown copy
      - bridge-state:/deno-dir/location_data                            # scan state; keep it
    depends_on:
      couchdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bridge-state:
