# Recyclarr: syncs TRaSH Guides quality profiles into Sonarr and Radarr (runs daily).
# API keys come from docker/media/.env (SONARR_API_KEY, RADARR_API_KEY).
# Profiles it creates:
#   Sonarr: "WEB-1080p" for normal TV, "[Anime] Remux-1080p" for anime
#   Radarr: "HD Bluray + WEB" for films
# After the first sync, pick the profile per series/film in Sonarr/Radarr.
# Try a dry run first:  docker exec recyclarr recyclarr sync --preview

sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1   # WEB-1080p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f   # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true

radarr:
  radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9   # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
